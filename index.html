<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup Codes</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Roboto,Arial,sans-serif;background:#f1f3f4;margin:0;padding:16px;color:#202124}
  .wrap{max-width:520px;margin:0 auto}
  .card{background:#fff;border:1px solid #dadce0;border-radius:8px;margin-bottom:16px;overflow:hidden}
  .head{padding:20px;text-align:center;border-bottom:1px solid #dadce0}
  .logo{font-size:32px;font-weight:500;letter-spacing:-1px}
  .logo span:nth-child(1){color:#4285f4}.logo span:nth-child(2){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}
  .logo span:nth-child(4){color:#4285f4}.logo span:nth-child(5){color:#34a853}.logo span:nth-child(6){color:#ea4335}
  .email{margin-top:10px;font-size:16px;word-break:break-all}
  ul{text-align:left;font-size:14px;color:#3c4043;margin:12px 0 0;padding-left:22px}
  .codes{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;padding:20px 24px}
  .code{font-size:19px;font-weight:500;display:flex;align-items:center;gap:10px}
  .box{width:20px;height:20px;border:2px solid #5f6368;border-radius:3px;flex:none}
  #lock{max-width:360px;margin:15vh auto 0;text-align:center;padding:24px}
  input{width:100%;padding:12px;font-size:18px;border:1px solid #dadce0;border-radius:6px;margin:12px 0}
  button{width:100%;padding:12px;font-size:16px;border:0;border-radius:6px;background:#1a73e8;color:#fff;cursor:pointer}
  #err{color:#d93025;min-height:22px;font-size:14px}
  #app{display:none}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="wrap">
  <div id="lock" class="card">
    <h2 style="margin:0 0 4px">Password</h2>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter password">
    <div id="err"></div>
    <button id="btn" type="button">Open</button>
  </div>
  <div id="app"></div>
</div>
<script>

function ror(x,n){return (x>>>n)|(x<<(32-n));}
function sha256(bytes){
  var mw=4294967296,h=[],k=[],comp={},pc=0,i,j;
  for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;h[pc]=(Math.pow(c,.5)*mw)|0;k[pc++]=(Math.pow(c,1/3)*mw)|0;}}
  h=h.slice(0,8);
  var l=bytes.length,m=bytes.slice();
  m.push(0x80);
  while(m.length%64!==56)m.push(0);
  var bl=l*8;
  for(var s=7;s>=0;s--)m.push(s>=4?0:(bl>>>(s*8))&255);
  for(var o=0;o<m.length;o+=64){
    var w=[];
    for(j=0;j<16;j++)w[j]=(m[o+4*j]<<24)|(m[o+4*j+1]<<16)|(m[o+4*j+2]<<8)|m[o+4*j+3];
    var a=h.slice(0);
    for(j=0;j<64;j++){
      if(j>=16){var w15=w[j-15],w2=w[j-2];
        var s0=ror(w15,7)^ror(w15,18)^(w15>>>3);
        var s1=ror(w2,17)^ror(w2,19)^(w2>>>10);
        w[j]=(w[j-16]+s0+w[j-7]+s1)|0;}
      var e=a[4],aa=a[0];
      var S1=ror(e,6)^ror(e,11)^ror(e,25);
      var ch=(e&a[5])^(~e&a[6]);
      var t1=(a[7]+S1+ch+k[j]+w[j])|0;
      var S0=ror(aa,2)^ror(aa,13)^ror(aa,22);
      var maj=(aa&a[1])^(aa&a[2])^(a[1]&a[2]);
      var t2=(S0+maj)|0;
      a=[(t1+t2)|0,a[0],a[1],a[2],(a[3]+t1)|0,a[4],a[5],a[6]];
    }
    for(j=0;j<8;j++)h[j]=(h[j]+a[j])|0;
  }
  var out=[];
  for(i=0;i<8;i++)out.push((h[i]>>>24)&255,(h[i]>>>16)&255,(h[i]>>>8)&255,h[i]&255);
  return out;
}
function strBytes(s){var r=[];for(var i=0;i<s.length;i++)r.push(s.charCodeAt(i)&255);return r;}
function deriveKey(pw,salt){
  var k=sha256(strBytes(pw+":"+salt));
  for(var i=0;i<2000;i++)k=sha256(k.concat(strBytes(pw)));
  return k;
}
function xorStream(bytes,key){
  var out=[],ctr=0,blk=[];
  for(var i=0;i<bytes.length;i++){
    if(i%32===0){blk=sha256(key.concat([(ctr>>>24)&255,(ctr>>>16)&255,(ctr>>>8)&255,ctr&255]));ctr++;}
    out.push(bytes[i]^blk[i%32]);
  }
  return out;
}
function toHex(b){var s="";for(var i=0;i<b.length;i++)s+=("0"+b[i].toString(16)).slice(-2);return s;}
function fromHex(s){var r=[];for(var i=0;i<s.length;i+=2)r.push(parseInt(s.substr(i,2),16));return r;}
function decryptData(pw,salt,hex){
  var plain=xorStream(fromHex(hex),deriveKey(pw,salt));
  var s="";for(var i=0;i<plain.length;i++)s+=String.fromCharCode(plain[i]);
  if(s.indexOf("OK:")!==0)return null;
  return JSON.parse(s.slice(3));
}

var SALT="gmail-backup-2026",DATA="11ae03954758b5a328a343a7ede1d42b01c7d0de6fb589dbc0404125d43c45c0a731ae68b702ab6eb985120f555b29157b789b71cacd647f5d670f22c440f3fd041bfaccc47d50780529d4a12228febc6249bb738ee98f2cf0087ad36defc27821d1e0431fedc8faf71e2d539047b7da8514bcff7aff7f941d79113473881eb5e1c052d9ab89b48784899f0e7364348dd670923b2eefac4b57ba5273494aa3441975dc26f07812c5ee296670c5b9e7ad817e0d07f38a66f16f3f85554fed550c2f81e2bd02a496a947ad275bf21ded654e5002ebe81321688ae2efccb0ebe710be31a7904d2d276232d4704c7f1c6a8706a2a2b8f9f91652d229eb162322c7519bf81b9ad48896060a657c45cce3c61ae3987993ec152e4af0a110d8e0192c3d9ea48919ddc4e8dd6892ae72a7be6b00f23cd5d5de8b98fd81b6e200f2c3b0876223076db0efc96b107b47f754350907e5777233fa9c7417dbdb65e19cd18a4752569a982d03aaa074c1f0240f806edf0bf0b651ab5f84b708c1ab89ff05b32d119bd775a412f0822550649ec260dcb3f6545c01919b78103d7880c3d2b29557b6a2af939c1b2735068b328ae2bbad07fb4a5c28ff18d10295eefd9b3894370a11ae6f8d4fd8187421c3dbfb96120512d6a1c14aebc0c373c3c125899a80d97e3181e82caa924905ebc0c763";
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function render(list){
  var app=document.getElementById('app');
  list.forEach(function(a){
    var card=el('div','card'),head=el('div','head'),logo=el('div','logo');
    'Google'.split('').forEach(function(ch){logo.appendChild(el('span',null,ch));});
    head.appendChild(logo);head.appendChild(el('div','email',a.email));
    var ul=el('ul');
    ['You can only use each backup code once','These codes were generated Oct 28, 2026'].forEach(function(t){ul.appendChild(el('li',null,t));});
    head.appendChild(ul);card.appendChild(head);
    var g=el('div','codes');
    a.codes.forEach(function(c){var d=el('div','code');d.appendChild(el('span','box'));d.appendChild(el('span',null,c));g.appendChild(d);});
    card.appendChild(g);app.appendChild(card);
  });
  document.getElementById('lock').style.display='none';
  app.style.display='block';
}
function tryOpen(){
  var err=document.getElementById('err');err.textContent='';
  try{
    var r=decryptData(document.getElementById('pw').value.trim(),SALT,DATA);
    if(!r){err.textContent='Wrong password';return;}
    render(r);
  }catch(e){err.textContent='Error: '+e.message;}
}
document.getElementById('btn').addEventListener('click',tryOpen);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13)tryOpen();});
</script>
